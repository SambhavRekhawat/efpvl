# Render blueprint for the EFPVL pricing engine (API only).
# The website itself is deployed separately on Vercel.
services:
  - type: web
    name: efpvl-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -e ./engine && pip install -r api/requirements.txt
    startCommand: cd api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: EFPVL_CORS_ORIGINS
        sync: false # set this to your Vercel URL in the Render dashboard
      - key: EFPVL_RATE_BUDGET
        value: "120"
